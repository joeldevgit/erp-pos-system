{% extends "base_admin.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<div class="container-fluid dashboard-page">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="mb-1 fw-bold">Dashboard</h3>
            <p class="text-secondary mb-0">Resumen general del sistema</p>
        </div>
    </div>

    <div class="row g-3 mb-4">

        <div class="col-xl-3 col-lg-4 col-md-6">
            <div class="card dashboard-card border-blue">
                <div class="card-body">
                    <div class="dashboard-card-top">
                        <div>
                            <span class="dash-label">Productos</span>
                            <h2>{{ total_productos|default:0 }}</h2>
                        </div>
                        <div class="dash-icon bg-blue">
                            <i class="bi bi-box-seam"></i>
                        </div>
                    </div>
                    <small>Stock total: {{ productos_stock|default:0 }}</small>
                </div>
            </div>
        </div>

        <div class="col-xl-3 col-lg-4 col-md-6">
            <div class="card dashboard-card border-red">
                <div class="card-body">
                    <div class="dashboard-card-top">
                        <div>
                            <span class="dash-label">Stock bajo</span>
                            <h2>{{ stock_bajo|default:0 }}</h2>
                        </div>
                        <div class="dash-icon bg-red">
                            <i class="bi bi-exclamation-triangle"></i>
                        </div>
                    </div>
                    <small>Productos críticos</small>
                </div>
            </div>
        </div>

    </div>

</div>

{% endblock %}

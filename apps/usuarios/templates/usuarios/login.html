<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        html, body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            min-height: 100svh;
            background:
                radial-gradient(circle at top left, rgba(13, 110, 253, 0.25), transparent 35%),
                linear-gradient(135deg, #0f172a, #111827, #020617);
            color: #fff;
        }

        .login-wrapper {
            min-height: 100svh;
            display: flex;
            align-items: center;      /* vertical */
            justify-content: center;  /* horizontal */
            padding: 2rem 0;
        }

        .brand-title {
            font-size: 3.4rem;
            font-weight: 800;
            color: #4f8cff;
            letter-spacing: -1px;
        }

        .brand-subtitle {
            font-size: 1.3rem;
            color: #d1d5db;
            max-width: 460px;
        }

        .login-card {
            background: #111827;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.45);
        }

        .form-control {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            height: 50px;
            border-radius: 10px;
            font-size: 16px;
        }

        .form-control:focus {
            background-color: #1f2937;
            color: #fff;
            border-color: #4f8cff;
            box-shadow: 0 0 0 0.25rem rgba(79, 140, 255, 0.2);
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        .btn-login {
            height: 50px;
            border-radius: 10px;
            font-weight: 700;
            background: #1877f2;
            border: none;
        }

        .btn-login:hover {
            background: #166fe5;
        }

        .small-text {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .divider {
            border-top: 1px solid rgba(255,255,255,0.12);
            margin: 1.5rem 0;
        }

        @media (max-width: 768px) {
            body {
                min-height: 100svh;
                overflow-y: auto;
            }

            .login-wrapper {
                min-height: auto;
                padding: 1rem 0.75rem;
            }

            .row {
                margin-left: 0;
                margin-right: 0;
            }

            .brand-title {
                font-size: 2rem;
                text-align: center;
                margin-top: 0.5rem;
            }

            .brand-subtitle {
                font-size: 0.95rem;
                text-align: center;
                margin: 0 auto 0.75rem;
            }

            .login-card {
                margin-top: 0.5rem;
                padding: 1.25rem !important;
            }

            .form-control,
            .btn-login {
                height: 46px;
                font-size: 16px;
            }

            .divider {
                margin: 1rem 0;
            }
        }
    </style>
</head>

<body>

<div class="container login-wrapper">

    <div class="row w-100 align-items-center justify-content-center">

        <div class="col-lg-6 mb-4 mb-lg-0">
            <h1 class="brand-title">POS / ERP</h1>

            <p class="brand-subtitle">
                Gestiona inventario y reportes desde una plataforma moderna.
            </p>
        </div>

        <div class="col-lg-4 col-md-6">

            <div class="login-card p-4">

                <h4 class="text-center mb-1 fw-bold">
                    Iniciar sesión
                </h4>

                <p class="text-center small-text mb-4">
                    Accede a tu panel administrativo
                </p>

                <form method="post" id="loginForm">
                    {% csrf_token %}

                    <div class="mb-3">
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Usuario"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="mb-3 position-relative">
                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control pe-5"
                            placeholder="Contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <span
                            class="position-absolute top-50 end-0 translate-middle-y me-3"
                            style="cursor:pointer;"
                            onclick="togglePassword()"
                        >
                            <i class="bi bi-eye-fill text-secondary" id="toggleIcon"></i>
                        </span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-login w-100" id="btnLogin">
                        <span id="btnText">Ingresar</span>

                        <span
                            id="btnSpinner"
                            class="spinner-border spinner-border-sm ms-2 d-none"
                            role="status"
                            aria-hidden="true">
                        </span>
                    </button>
                </form>

                {% if messages %}
                    <div class="mt-3">
                        {% for message in messages %}
                            <div class="alert alert-danger py-2 mb-2">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <div class="divider"></div>

                <p class="text-center small-text mb-0">
                    Sistema Inventario
                </p>

            </div>

        </div>

    </div>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const icon = document.getElementById("toggleIcon");

    if (password.type === "password") {
        password.type = "text";
        icon.classList.remove("bi-eye-fill");
        icon.classList.add("bi-eye-slash-fill");
    } else {
        password.type = "password";
        icon.classList.remove("bi-eye-slash-fill");
        icon.classList.add("bi-eye-fill");
    }
}

document.getElementById("loginForm").addEventListener("submit", function() {
    const btn = document.getElementById("btnLogin");
    const spinner = document.getElementById("btnSpinner");
    const text = document.getElementById("btnText");

    btn.disabled = true;
    spinner.classList.remove("d-none");
    text.textContent = "Ingresando...";
});
</script>

</body>
</html>

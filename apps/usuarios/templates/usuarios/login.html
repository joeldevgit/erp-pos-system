{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'usuarios/css/login.css' %}">
</head>





<body>

<div class="container login-wrapper">

    <div class="row w-100 align-items-center justify-content-center">

        <div class="col-lg-6 mb-4 mb-lg-0">
            <h1 class="brand-title">POS / ERP</h1>

            <p class="brand-subtitle">
                Gestiona inventario y reportes desde una plataforma moderna.
            </p>
        </div>

        <div class="col-lg-4 col-md-6">

            <div class="login-card p-4">

                <h4 class="text-center mb-1 fw-bold">
                    Iniciar sesión
                </h4>

                <p class="text-center small-text mb-4">
                    Accede a tu panel administrativo
                </p>

                <form method="post" id="loginForm">
                    {% csrf_token %}

                    <div class="mb-3">
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Usuario"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="mb-3 position-relative">
                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control pe-5"
                            placeholder="Contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <span
                            class="position-absolute top-50 end-0 translate-middle-y me-3"
                            style="cursor:pointer;"
                            onclick="togglePassword()"
                        >
                            <i class="bi bi-eye-fill text-secondary" id="toggleIcon"></i>
                        </span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-login w-100" id="btnLogin">
                        <span id="btnText">Ingresar</span>

                        <span
                            id="btnSpinner"
                            class="spinner-border spinner-border-sm ms-2 d-none"
                            role="status"
                            aria-hidden="true">
                        </span>
                    </button>
                </form>

                {% if messages %}
                    <div class="mt-3">
                        {% for message in messages %}
                            <div class="alert alert-danger py-2 mb-2">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <div class="divider"></div>

                <p class="text-center small-text mb-0">
                    Sistema Inventario
                </p>

            </div>

        </div>

    </div>

</div>



<script src="{% static 'usuarios/js/login.js' %}"></script>
</body>
</html>

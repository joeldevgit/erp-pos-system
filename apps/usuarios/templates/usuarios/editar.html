{% extends "base_admin.html" %}

{% block title %}Editar usuario{% endblock %}

{% block content %}
<style>
    .usuario-form-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        color: var(--text-color);
    }

    .usuario-form-card h4,
    .usuario-form-card label {
        color: var(--text-color);
    }

    .usuario-form-card .form-control,
    .usuario-form-card .form-select {
        background: var(--bg-main);
        color: var(--text-color);
        border: 1px solid var(--border-color);
    }

    .usuario-form-card .form-control:disabled {
        background: var(--hover-bg);
        color: var(--text-sidebar);
        border: 1px solid var(--border-color);
    }

    .usuario-form-card .form-control:focus,
    .usuario-form-card .form-select:focus {
        background: var(--bg-main);
        color: var(--text-color);
        border-color: #0d6efd;
        box-shadow: 0 0 0 .2rem rgba(13,110,253,.25);
    }

    .dark-mode .usuario-form-card .form-select option {
        background: #20202e;
        color: #fff;
    }

    .btn-cancelar {
        background: var(--bg-main);
        color: var(--text-color);
        border: 1px solid var(--border-color);
    }

    .btn-cancelar:hover {
        background: var(--hover-bg);
        color: var(--text-color);
    }
</style>

<div class="container-fluid">

    <div class="card shadow-sm usuario-form-card">
        <div class="card-body">

            <h4 class="mb-4">Editar usuario</h4>

            <form method="post">
                {% csrf_token %}

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Usuario</label>
                        <input
                            type="text"
                            class="form-control"
                            value="{{ usuario_obj.username }}"
                            disabled
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Nombre</label>
                        <input
                            type="text"
                            name="first_name"
                            class="form-control"
                            value="{{ usuario_obj.first_name }}"
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ usuario_obj.email }}"
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Rol</label>
                        <select name="grupo_id" class="form-select">
                            <option value="">Sin rol</option>

                            {% for grupo in grupos %}
                                <option
                                    value="{{ grupo.id }}"
                                    {% if grupo_actual and grupo.id == grupo_actual.id %}selected{% endif %}
                                >
                                    {{ grupo.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                </div>

                <div class="mt-4 text-end">
                    <a
                        href="{% url 'usuarios:lista' %}"
                        class="btn btn-light btn-cancelar"
                    >
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-success">
                        Guardar cambios
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}
